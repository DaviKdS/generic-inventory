<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar cama</title>
  <meta name="theme-color" content="#f4f9fc">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg?v=20261013-globe-bed" type="image/svg+xml">
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem("generic-inventory.theme");
        const systemTheme = "light";
        document.documentElement.dataset.theme = storedTheme || systemTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=20261013-light-theme-type">
  <link rel="stylesheet" href="/form.css?v=20261013-standard-blue">
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="/form.js?v=20261015-bed-fields"></script>
  <script type="module" src="/plasma-visual.js?v=20261013-plasma-motion"></script>
</head>
<body class="form-page">
  <div id="plasmaLayer" aria-hidden="true"></div>
  <main class="form-shell">
    <header class="form-topbar">
      <a class="icon-button ghost" href="/?view=rooms" aria-label="Voltar para reservas" title="Voltar">
        <i data-lucide="arrow-left"></i>
      </a>
      <div>
        <span class="tag">Reservas</span>
        <h1 id="formTitle">Editar cama</h1>
        <p id="formSubtitle">Escolha o status e preencha os campos necessários.</p>
      </div>
    </header>

    <section id="formMessage" class="message hidden"></section>
    <section id="formContent" class="form-content"></section>
  </main>
</body>
</html>
