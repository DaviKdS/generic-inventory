<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Estoque</title>
  <meta name="theme-color" content="#f6f7f4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Estoque">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <script>
    (() => {
      try {
        const storedTheme = localStorage.getItem("generic-inventory.theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = storedTheme || systemTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main id="authGate" class="auth-gate">
    <section class="auth-panel">
      <div class="auth-brand-row">
        <strong class="brand-mark" aria-label="Controle de Estoque">GI</strong>
        <div class="auth-actions">
          <button class="icon-button ghost language-toggle" type="button" data-language-toggle title="Switch to English" aria-label="Switch to English">
            <i data-lucide="languages"></i>
          </button>
          <button class="icon-button ghost theme-toggle" type="button" data-theme-toggle title="Alternar tema" aria-label="Alternar tema">
            <i data-lucide="moon"></i>
          </button>
        </div>
      </div>
      <div>
        <h1>Controle de Estoque</h1>
        <p id="authHint">Entre com uma conta liberada pelo administrador.</p>
      </div>

      <div class="tabs auth-tabs">
        <button class="tab active" type="button" data-auth-tab="login">Entrar</button>
        <button class="tab" type="button" data-auth-tab="register">Cadastro</button>
        <button class="tab" type="button" data-auth-tab="password">Senha</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <label>
          <span>E-mail</span>
          <input name="email" autocomplete="email" required>
        </label>
        <label>
          <span>Senha</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="form-actions">
          <button class="button primary" type="submit">Entrar</button>
          <button class="button ghost" type="button" data-forgot-password>Link de senha</button>
        </div>
      </form>

      <form id="registerForm" class="auth-form">
        <label>
          <span>Nome</span>
          <input name="name" autocomplete="name" required>
        </label>
        <label>
          <span>E-mail</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          <span>Senha</span>
          <input name="password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button class="button primary full" type="submit">Enviar cadastro</button>
      </form>

      <form id="passwordForm" class="auth-form">
        <label>
          <span>Nova senha</span>
          <input name="password" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <label>
          <span>Confirmar senha</span>
          <input name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
        </label>
        <button class="button primary full" type="submit">Definir senha</button>
      </form>

      <p id="authMessage" class="message"></p>
    </section>
  </main>

  <section id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <strong class="brand-mark compact" aria-label="Controle de Estoque">GI</strong>
        <div>
          <strong>Estoque</strong>
          <span>Controle geral</span>
        </div>
        <button id="sidebarToggle" class="icon-button ghost sidebar-toggle" type="button" aria-label="Recolher menu" title="Recolher menu">
          <i data-lucide="panel-left-close"></i>
        </button>
      </div>
      <nav id="navMenu" class="nav-menu"></nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Estoque</h1>
          <p id="viewSubtitle"></p>
        </div>
        <div id="userMenu" class="user-menu"></div>
      </header>

      <section id="toast" class="toast hidden"></section>
      <section id="content" class="content"></section>
      <footer id="siteFooter" class="site-footer"></footer>
    </div>
  </section>
</body>
</html>
