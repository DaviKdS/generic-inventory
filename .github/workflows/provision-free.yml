name: Provision Azure FREE infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REQUIRED_SKU: 'F1'
  REQUIRED_TIER: 'Free'
  BICEP_FILE: 'infra/main.bicep'
  AZURE_RESOURCE_GROUP: 'rg-generic-inventory-free'
  AZURE_LOCATION: 'brazilsouth'
  AZURE_APP_SERVICE_PLAN_NAME: 'asp-generic-inventory-free'
  AZURE_WEBAPP_NAME: 'generic-inventory-davikds-free'

jobs:
  provision:
    name: Provision F1-only Azure resources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm target resource group already exists
        shell: bash
        run: |
          set -euo pipefail
          RG='${{ env.AZURE_RESOURCE_GROUP }}'

          if ! az group show --name "$RG" >/dev/null 2>&1; then
            echo "::error::Resource group '$RG' does not exist. Create it manually first. This workflow does not create subscription-level resources."
            exit 1
          fi

      - name: Zero-cost guard - reject unexpected existing resources
        shell: bash
        run: |
          set -euo pipefail

          RG='${{ env.AZURE_RESOURCE_GROUP }}'
          EXPECTED_PLAN='${{ env.AZURE_APP_SERVICE_PLAN_NAME }}'
          EXPECTED_APP='${{ env.AZURE_WEBAPP_NAME }}'

          mapfile -t RESOURCES < <(az resource list --resource-group "$RG" --query "[].{name:name,type:type}" -o tsv)

          if [ "${#RESOURCES[@]}" -gt 2 ]; then
            echo "::error::Provisioning blocked: more than 2 top-level resources already exist in '$RG'."
            printf 'Detected resource: %s\n' "${RESOURCES[@]}"
            exit 1
          fi

          for resource in "${RESOURCES[@]}"; do
            NAME="$(awk '{print $1}' <<< "$resource")"
            TYPE="$(awk '{print $2}' <<< "$resource")"

            if [ "$NAME" = "$EXPECTED_PLAN" ] && [ "$TYPE" = "Microsoft.Web/serverfarms" ]; then
              continue
            elif [ "$NAME" = "$EXPECTED_APP" ] && [ "$TYPE" = "Microsoft.Web/sites" ]; then
              continue
            else
              echo "::error::Provisioning blocked: unexpected Azure resource '$NAME' of type '$TYPE' exists in '$RG'."
              exit 1
            fi
          done

          echo "Existing-resource allow-list passed."

      - name: Validate Bicep contains F1 hard lock
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "requiredSkuName = 'F1'" "${{ env.BICEP_FILE }}"; then
            echo "::error::F1 hard lock is missing from the Bicep template."
            exit 1
          fi

          if grep -Eq "B1|B2|B3|P0|P1|P2|P3|S1|S2|S3" "${{ env.BICEP_FILE }}"; then
            echo "::error::A paid App Service SKU token was found in the FREE Bicep template."
            exit 1
          fi

      - name: Preview Azure changes
        shell: bash
        run: |
          set -euo pipefail

          az deployment group what-if \
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' \
            --template-file '${{ env.BICEP_FILE }}' \
            --parameters \
              location='${{ env.AZURE_LOCATION }}' \
              appServicePlanName='${{ env.AZURE_APP_SERVICE_PLAN_NAME }}' \
              webAppName='${{ env.AZURE_WEBAPP_NAME }}'

      - name: Provision F1 App Service Plan and Web App
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --name "generic-inventory-free-${GITHUB_RUN_ID}" \
            --resource-group '${{ env.AZURE_RESOURCE_GROUP }}' \
            --template-file '${{ env.BICEP_FILE }}' \
            --parameters \
              location='${{ env.AZURE_LOCATION }}' \
              appServicePlanName='${{ env.AZURE_APP_SERVICE_PLAN_NAME }}' \
              webAppName='${{ env.AZURE_WEBAPP_NAME }}'

      - name: Verify provisioned plan is exactly F1 and resource group is clean
        shell: bash
        run: |
          set -euo pipefail

          RG='${{ env.AZURE_RESOURCE_GROUP }}'
          APP='${{ env.AZURE_WEBAPP_NAME }}'
          EXPECTED_PLAN='${{ env.AZURE_APP_SERVICE_PLAN_NAME }}'

          PLAN_ID="$(az webapp show --name "$APP" --resource-group "$RG" --query serverFarmId -o tsv)"
          PLAN_NAME="$(basename "$PLAN_ID")"
          SKU_NAME="$(az appservice plan show --ids "$PLAN_ID" --query 'sku.name' -o tsv)"
          SKU_TIER="$(az appservice plan show --ids "$PLAN_ID" --query 'sku.tier' -o tsv)"

          echo "Provisioned plan: $PLAN_NAME"
          echo "Provisioned SKU: $SKU_NAME ($SKU_TIER)"

          if [ "$PLAN_NAME" != "$EXPECTED_PLAN" ]; then
            echo "::error::Cost guard failed. Expected plan '$EXPECTED_PLAN', got '$PLAN_NAME'."
            exit 1
          fi

          if [ "$SKU_NAME" != "${{ env.REQUIRED_SKU }}" ] || [ "$SKU_TIER" != "${{ env.REQUIRED_TIER }}" ]; then
            echo "::error::Cost guard failed. Expected F1/Free, got $SKU_NAME/$SKU_TIER."
            exit 1
          fi

          mapfile -t RESOURCES < <(az resource list --resource-group "$RG" --query "[].{name:name,type:type}" -o tsv)

          if [ "${#RESOURCES[@]}" -ne 2 ]; then
            echo "::error::Cost guard failed: expected exactly 2 top-level resources after provisioning, found ${#RESOURCES[@]}."
            printf 'Detected resource: %s\n' "${RESOURCES[@]:-<none>}"
            exit 1
          fi

          FOUND_PLAN=0
          FOUND_APP=0

          for resource in "${RESOURCES[@]}"; do
            NAME="$(awk '{print $1}' <<< "$resource")"
            TYPE="$(awk '{print $2}' <<< "$resource")"

            if [ "$NAME" = "$EXPECTED_PLAN" ] && [ "$TYPE" = "Microsoft.Web/serverfarms" ]; then
              FOUND_PLAN=1
            elif [ "$NAME" = "$APP" ] && [ "$TYPE" = "Microsoft.Web/sites" ]; then
              FOUND_APP=1
            else
              echo "::error::Cost guard failed: unexpected resource '$NAME' of type '$TYPE'."
              exit 1
            fi
          done

          if [ "$FOUND_PLAN" -ne 1 ] || [ "$FOUND_APP" -ne 1 ]; then
            echo "::error::Cost guard failed: expected FREE resources are missing."
            exit 1
          fi

          echo "FREE infrastructure verified: exact F1/Free plan and no unexpected top-level resources."
